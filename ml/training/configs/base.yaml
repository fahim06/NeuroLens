# Training System Configuration
# NeuroLens v3.0

# Base training configuration - inherit and override for specific models

# Model settings
model:
  name: "baseline"
  version: "1.0.0"
  architecture: "custom_cnn"
  num_classes: 4
  input_shape: [224, 224, 3]
  pretrained: false

# Dataset settings
dataset:
  name: "brain_tumor"
  path: "data/brain_tumor"
  validation_split: 0.15
  test_split: 0.15
  shuffle: true
  stratify: true

# Training settings
training:
  epochs: 100
  batch_size: 32
  initial_learning_rate: 0.001
  optimizer: "adam"
  loss: "categorical_crossentropy"
  metrics:
    - "accuracy"
    - "precision"
    - "recall"

# Early stopping
early_stopping:
  enabled: true
  patience: 15
  monitor: "val_loss"
  mode: "min"
  restore_best_weights: true

# Learning rate schedule
lr_schedule:
  enabled: true
  type: "reduce_on_plateau"
  factor: 0.5
  patience: 5
  min_lr: 0.00001

# Augmentation settings
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: false
  rotation_range: 15
  zoom_range: 0.1
  brightness_range: [0.9, 1.1]
  shear_range: 0.1

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true

# Checkpointing
checkpointing:
  enabled: true
  save_best_only: true
  monitor: "val_accuracy"
  mode: "max"
  save_freq: "epoch"

# Logging
logging:
  level: "INFO"
  log_dir: "logs/training"

# MLflow experiment tracking
mlflow:
  enabled: true
  experiment_name: "neurolens-training"
  tracking_uri: "mlruns"
  log_models: true
  log_datasets: true
