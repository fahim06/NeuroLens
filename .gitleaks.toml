# NeuroLens Gitleaks Configuration
# Secrets detection rules

title = "NeuroLens Gitleaks Configuration"

[allowlist]
description = "Global allowlist"
paths = [
    '''^\.git/''',
    '''node_modules''',
    '''__pycache__''',
    '''\.venv''',
    '''venv''',
    '''\.env\.example$''',
    '''\.env\.sample$''',
    '''docs/.*\.md$''',
    '''test.*\.py$''',
]

# Ignore specific patterns that are known false positives
regexes = [
    '''example\.com''',
    '''localhost''',
    '''127\.0\.0\.1''',
    '''test[-_]?key''',
    '''fake[-_]?key''',
    '''dummy[-_]?key''',
]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "aws"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws(.{0,20})?(?-i)['\"][0-9a-zA-Z\/+]{40}['\"]'''
tags = ["key", "aws"]

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36}'''
tags = ["key", "github"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api_secret)['\"]?\s*[:=]\s*['\"]?[a-z0-9_\-]{20,}['\"]?'''
tags = ["key", "api"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd|token)['\"]?\s*[:=]\s*['\"]?[^\s'"]{8,}['\"]?'''
tags = ["secret"]
[rules.allowlist]
regexes = [
    '''(?i)password\s*=\s*['\"]?\$\{''',  # Environment variable substitution
    '''(?i)password\s*=\s*os\.getenv''',
    '''(?i)password\s*=\s*None''',
    '''(?i)password\s*:\s*str''',
]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["token", "jwt"]

[[rules]]
id = "stripe-key"
description = "Stripe API Key"
regex = '''(?i)sk_(live|test)_[0-9a-zA-Z]{24,}'''
tags = ["key", "stripe"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8,12}/[a-zA-Z0-9_]{24}'''
tags = ["webhook", "slack"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["key", "google"]

[[rules]]
id = "heroku-api-key"
description = "Heroku API Key"
regex = '''(?i)heroku(.{0,20})?['\"][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}['\"]'''
tags = ["key", "heroku"]

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}'''
tags = ["key", "sendgrid"]

[[rules]]
id = "database-url"
description = "Database Connection URL with Password"
regex = '''(?i)(postgres|mysql|mongodb)://[^:]+:[^@]+@'''
tags = ["database", "url"]
[rules.allowlist]
regexes = [
    '''localhost''',
    '''127\.0\.0\.1''',
    '''example\.com''',
]
