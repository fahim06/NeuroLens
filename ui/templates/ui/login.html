{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="NeuroLens - AI-Powered Retinal Image Analysis">
    <meta name="theme-color" content="#3b82f6">
    
    <title>Login | NeuroLens</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'ui/images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'ui/images/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'ui/images/apple-touch-icon.png' %}">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
          integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" 
          crossorigin="anonymous">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'ui/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'ui/css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'ui/css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'ui/css/responsive.css' %}">
</head>
<body class="auth-body">
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Animated Background -->
    <div class="auth-background">
        <div class="particles" id="particles"></div>
        <div class="gradient-overlay"></div>
    </div>
    
    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo & Title -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa-solid fa-eye"></i>
                </div>
                <h1 class="auth-title">NeuroLens</h1>
                <p class="auth-subtitle">AI-Powered Retinal Analysis</p>
                <span class="badge info">Beta</span>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fa-solid fa-user"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fa-solid fa-lock"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkbox-custom"></span>
                        Remember me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <i class="fa-solid fa-arrow-right btn-icon"></i>
                    <span class="btn-loader" style="display: none;">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p class="auth-footer-text">
                    <i class="fa-solid fa-shield-halved"></i>
                    Secure authentication via JWT
                </p>
                <button id="themeToggle" class="theme-toggle-inline" aria-label="Toggle theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
        
        <!-- Version Info -->
        <div class="version-info">
            <span>NeuroLens v1.0.0-beta</span>
            <span class="separator">|</span>
            <span>Django + DRF</span>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="{% static 'ui/js/app.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize theme
            initTheme();
            
            // Create particles
            createParticles();
            
            // Password toggle
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordInput = document.getElementById('password');
            
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                passwordToggle.innerHTML = type === 'password' 
                    ? '<i class="fa-solid fa-eye"></i>' 
                    : '<i class="fa-solid fa-eye-slash"></i>';
            });
            
            // Theme toggle
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.addEventListener('click', toggleTheme);
            
            // Login form submission
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                
                if (!username || !password) {
                    showToast('Please enter username and password', 'warning');
                    return;
                }
                
                // Show loading state
                loginBtn.disabled = true;
                loginBtn.querySelector('.btn-text').style.display = 'none';
                loginBtn.querySelector('.btn-icon').style.display = 'none';
                loginBtn.querySelector('.btn-loader').style.display = 'inline-block';
                
                try {
                    const response = await fetch('/api/auth/token/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.access) {
                        // Store tokens
                        NeuroLens.TokenManager.setTokens(data.access, data.refresh);
                        
                        // Store user data if available
                        if (data.user) {
                            NeuroLens.UserManager.setData(data.user);
                        } else {
                            NeuroLens.UserManager.setData({ username });
                        }
                        
                        showToast('Login successful! Redirecting...', 'success');
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/ui/dashboard/';
                        }, 500);
                    } else {
                        showToast(data.detail || 'Invalid credentials', 'error');
                        
                        // Shake animation on error
                        const authCard = document.querySelector('.auth-card');
                        authCard.classList.add('shake');
                        setTimeout(() => authCard.classList.remove('shake'), 500);
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('Network error. Please try again.', 'error');
                } finally {
                    // Reset button state
                    loginBtn.disabled = false;
                    loginBtn.querySelector('.btn-text').style.display = 'inline';
                    loginBtn.querySelector('.btn-icon').style.display = 'inline';
                    loginBtn.querySelector('.btn-loader').style.display = 'none';
                }
            });
            
            // Focus first input
            document.getElementById('username').focus();
        });
        
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Random size (2-6px)
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Random animation delay and duration
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                
                container.appendChild(particle);
            }
        }
    </script>
</body>
</html>
