# Backend CI Pipeline
# Triggers on PRs and pushes to feature branches
# Checks: Linting, Type checks, Unit tests, Security scan

name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/backend/**"
      - "pyproject.toml"
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "dev"
    paths:
      - "backend/**"
      - "tests/backend/**"

env:
  PYTHON_VERSION: "3.11"
  CONDA_ENV: neurolens-api

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff linter
        run: ruff check backend/ --output-format=github

      - name: Check black formatting
        run: black --check backend/

      - name: Check import sorting
        run: isort --check-only backend/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-PyYAML
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run mypy
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run unit tests
        run: |
          pytest tests/backend/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit security scan
        run: bandit -r backend/ -ll -ii -x tests

      - name: Check dependencies for vulnerabilities
        run: |
          if [ -f backend/requirements.txt ]; then
            safety check -r backend/requirements.txt --full-report || true
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: neurolens-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run API tests
        env:
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test
        run: pytest tests/backend/ -v -m "api or integration" || true
