# Prometheus Configuration for NeuroLens

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Backend API metrics
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Inference server metrics
  - job_name: "inference"
    static_configs:
      - targets: ["inference:8001"]
    metrics_path: /metrics

  # Redis metrics (via redis-exporter if available)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
