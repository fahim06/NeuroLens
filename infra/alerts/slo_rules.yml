# NeuroLens SLO Alert Rules
# Prometheus AlertManager compatible rules for Service Level Objectives

groups:
  - name: neurolens.api.slos
    rules:
      # Latency SLOs
      - alert: APIHighLatencyP99
        expr: |
          histogram_quantile(0.99, 
            sum(rate(neurolens_http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency (P99 > 500ms)"
          description: "API endpoint {{ $labels.endpoint }} P99 latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/api-latency"

      - alert: APIHighLatencyP99Critical
        expr: |
          histogram_quantile(0.99, 
            sum(rate(neurolens_http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 1.0
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical API latency (P99 > 1s)"
          description: "API endpoint {{ $labels.endpoint }} P99 latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/api-latency"

      # Error Rate SLOs
      - alert: APIHighErrorRate
        expr: |
          sum(rate(neurolens_http_requests_total{status=~"5.."}[5m])) by (endpoint)
          /
          sum(rate(neurolens_http_requests_total[5m])) by (endpoint)
          > 0.01
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API error rate (> 1%)"
          description: "API endpoint {{ $labels.endpoint }} error rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/api-errors"

      - alert: APIHighErrorRateCritical
        expr: |
          sum(rate(neurolens_http_requests_total{status=~"5.."}[5m])) by (endpoint)
          /
          sum(rate(neurolens_http_requests_total[5m])) by (endpoint)
          > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical API error rate (> 5%)"
          description: "API endpoint {{ $labels.endpoint }} error rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/api-errors"

      # Availability
      - alert: APIDown
        expr: up{job="neurolens-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "NeuroLens API is down"
          description: "NeuroLens API instance {{ $labels.instance }} is not responding"
          runbook_url: "https://docs.neurolens.io/runbooks/api-down"

  - name: neurolens.inference.slos
    rules:
      # Inference Latency SLOs
      - alert: InferenceHighLatency
        expr: |
          histogram_quantile(0.95, 
            sum(rate(neurolens_inference_duration_seconds_bucket[5m])) by (le, model)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "High inference latency (P95 > 1s)"
          description: "Model {{ $labels.model }} P95 inference latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/inference-latency"

      - alert: InferenceHighLatencyCritical
        expr: |
          histogram_quantile(0.95, 
            sum(rate(neurolens_inference_duration_seconds_bucket[5m])) by (le, model)
          ) > 5.0
        for: 2m
        labels:
          severity: critical
          component: inference
        annotations:
          summary: "Critical inference latency (P95 > 5s)"
          description: "Model {{ $labels.model }} P95 inference latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/inference-latency"

      # Inference Error Rate
      - alert: InferenceHighErrorRate
        expr: |
          sum(rate(neurolens_inference_requests_total{status="error"}[5m])) by (model)
          /
          sum(rate(neurolens_inference_requests_total[5m])) by (model)
          > 0.02
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "High inference error rate (> 2%)"
          description: "Model {{ $labels.model }} error rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/inference-errors"

      # Queue Saturation
      - alert: InferenceQueueBacklog
        expr: neurolens_inference_queue_size > 100
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "Inference queue backlog building"
          description: "Model {{ $labels.model }} queue size is {{ $value }}"
          runbook_url: "https://docs.neurolens.io/runbooks/inference-queue"

      - alert: InferenceQueueBacklogCritical
        expr: neurolens_inference_queue_size > 500
        for: 2m
        labels:
          severity: critical
          component: inference
        annotations:
          summary: "Critical inference queue backlog"
          description: "Model {{ $labels.model }} queue size is {{ $value }}"
          runbook_url: "https://docs.neurolens.io/runbooks/inference-queue"

  - name: neurolens.resources
    rules:
      # CPU Usage
      - alert: HighCPUUsage
        expr: neurolens_cpu_usage_percent > 80
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage (> 80%)"
          description: "CPU usage is {{ $value }}%"
          runbook_url: "https://docs.neurolens.io/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: neurolens_cpu_usage_percent > 95
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical CPU usage (> 95%)"
          description: "CPU usage is {{ $value }}%"
          runbook_url: "https://docs.neurolens.io/runbooks/high-cpu"

      # Memory Usage
      - alert: HighMemoryUsage
        expr: |
          neurolens_memory_usage_bytes / 
          (node_memory_MemTotal_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage (> 85%)"
          description: "Memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/high-memory"

      - alert: CriticalMemoryUsage
        expr: |
          neurolens_memory_usage_bytes / 
          (node_memory_MemTotal_bytes) > 0.95
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage (> 95%)"
          description: "Memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/high-memory"

      # GPU Usage
      - alert: HighGPUUsage
        expr: neurolens_gpu_usage_percent > 90
        for: 10m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "High GPU usage (> 90%)"
          description: "GPU {{ $labels.device }} usage is {{ $value }}%"
          runbook_url: "https://docs.neurolens.io/runbooks/high-gpu"

      - alert: GPUMemoryNearFull
        expr: |
          neurolens_gpu_memory_bytes / 
          (nvidia_smi_memory_total_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU memory near capacity (> 90%)"
          description: "GPU {{ $labels.device }} memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.neurolens.io/runbooks/gpu-memory"

  - name: neurolens.training
    rules:
      # Training Job Failures
      - alert: TrainingJobFailures
        expr: |
          sum(increase(neurolens_training_jobs_total{status="failed"}[1h])) > 3
        for: 5m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Multiple training job failures"
          description: "{{ $value }} training jobs have failed in the last hour"
          runbook_url: "https://docs.neurolens.io/runbooks/training-failures"

      # Long Running Training
      - alert: TrainingJobStuck
        expr: |
          time() - neurolens_training_job_start_time > 86400
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training job running for > 24 hours"
          description: "Training job {{ $labels.job_id }} has been running for {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/training-stuck"

  - name: neurolens.models
    rules:
      # Model Loading Issues
      - alert: ModelLoadSlowdown
        expr: |
          histogram_quantile(0.95, 
            sum(rate(neurolens_model_load_duration_seconds_bucket[10m])) by (le, model)
          ) > 30
        for: 5m
        labels:
          severity: warning
          component: model
        annotations:
          summary: "Slow model loading (P95 > 30s)"
          description: "Model {{ $labels.model }} P95 load time is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.neurolens.io/runbooks/model-load"

      # No Models Loaded
      - alert: NoModelsLoaded
        expr: neurolens_models_loaded == 0
        for: 5m
        labels:
          severity: critical
          component: model
        annotations:
          summary: "No models currently loaded"
          description: "No models are loaded in the inference service"
          runbook_url: "https://docs.neurolens.io/runbooks/no-models"

  - name: neurolens.error_budget
    rules:
      # Error Budget Consumption (SLO: 99.9% availability = 0.1% error budget)
      - alert: ErrorBudgetBurnRateHigh
        expr: |
          (
            sum(rate(neurolens_http_requests_total{status=~"5.."}[1h]))
            /
            sum(rate(neurolens_http_requests_total[1h]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          component: slo
        annotations:
          summary: "High error budget burn rate"
          description: "Current error rate is 10x the allowed budget"
          runbook_url: "https://docs.neurolens.io/runbooks/error-budget"

      # Monthly Error Budget Exhaustion
      - alert: ErrorBudgetExhausted
        expr: |
          (
            1 - (
              sum(increase(neurolens_http_requests_total{status=~"5.."}[30d]))
              /
              sum(increase(neurolens_http_requests_total[30d]))
            )
          ) < 0.999
        for: 5m
        labels:
          severity: critical
          component: slo
        annotations:
          summary: "Monthly error budget exhausted"
          description: "Monthly availability is below SLO target of 99.9%"
          runbook_url: "https://docs.neurolens.io/runbooks/error-budget"
