# ============================================================
# NeuroLens — Docker Compose (Local & CI)
# ============================================================

services:
  # ============================================================
  # POSTGRES DATABASE
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: neurolens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurolens}
      POSTGRES_USER: ${POSTGRES_USER:-neurolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurolens_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurolens} -d ${POSTGRES_DB:-neurolens}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # REDIS CACHE/BROKER
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: neurolens-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # BACKEND (Django)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    container_name: neurolens-backend
    # Override the production CMD to use the dev server with auto-reload
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgresql://neurolens:neurolens_secret@postgres:5432/neurolens
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # TensorFlow thread controls for memory optimization
      - OMP_NUM_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - TF_NUM_INTEROP_THREADS=1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${UI_PORT:-80}:80"
      - "8000:8000"
    volumes:
      # Dev only: mount source for hot reload
      - .:/app:cached
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================
  # CELERY WORKER (Background Tasks)
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: neurolens-celery-worker
    # Use watchdog to auto-reload celery on code changes (optional, requires 'watchdog' in requirements.txt)
    # For now, standard worker. You may need to restart this container if you change task code.
    command: sh -c "python manage.py migrate --noinput && celery -A neurolens worker -l INFO"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-neurolens}:${POSTGRES_PASSWORD:-neurolens_secret}@postgres:5432/${POSTGRES_DB:-neurolens}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  # ============================================================
  # CELERY BEAT (Scheduled Tasks)
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: neurolens-celery-beat
    command: sh -c "python manage.py migrate --noinput && celery -A neurolens beat -l INFO --schedule=/tmp/celerybeat-schedule"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-neurolens}:${POSTGRES_PASSWORD:-neurolens_secret}@postgres:5432/${POSTGRES_DB:-neurolens}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: neurolens-network
