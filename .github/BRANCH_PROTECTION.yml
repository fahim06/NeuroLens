# ============================================================
# NeuroLens — Branch Protection Settings
# ============================================================
# This file documents the required branch protection rules
# Apply these settings in GitHub Repository Settings > Branches
# ============================================================

# =====================================================
# BRANCH: main (Production)
# =====================================================
main:
  # Require pull request reviews before merging
  required_pull_request_reviews:
    required_approving_review_count: 2
    dismiss_stale_reviews: true
    require_code_owner_reviews: true
    require_last_push_approval: true

  # Require status checks to pass before merging
  required_status_checks:
    strict: true # Require branch to be up to date
    contexts:
      - "Backend CI Status"
      - "Frontend CI Status"
      - "Security Status"
      - "CodeQL Analysis"

  # Require conversation resolution before merging
  required_conversation_resolution: true

  # Require signed commits
  required_signatures: true

  # Do not allow bypassing the above settings
  enforce_admins: true

  # Restrict who can push to matching branches
  restrictions:
    users: []
    teams:
      - maintainers
      - release-managers

  # Additional rules
  allow_force_pushes: false
  allow_deletions: false
  require_linear_history: true

  # Lock branch (optional - for freeze periods)
  lock_branch: false

# =====================================================
# BRANCH: dev (Staging)
# =====================================================
dev:
  # Require pull request reviews before merging
  required_pull_request_reviews:
    required_approving_review_count: 1
    dismiss_stale_reviews: true
    require_code_owner_reviews: false
    require_last_push_approval: false

  # Require status checks to pass before merging
  required_status_checks:
    strict: true
    contexts:
      - "Backend CI Status"
      - "Frontend CI Status"

  # Require conversation resolution before merging
  required_conversation_resolution: true

  # Do not require signed commits for dev
  required_signatures: false

  # Allow admins to bypass for hotfixes
  enforce_admins: false

  # No push restrictions for dev
  restrictions: null

  # Additional rules
  allow_force_pushes: false
  allow_deletions: false
  require_linear_history: false

  lock_branch: false

# =====================================================
# BRANCH: django-rebuild (Beta/Feature)
# =====================================================
django-rebuild:
  # Minimal protection for active development
  required_pull_request_reviews:
    required_approving_review_count: 0
    dismiss_stale_reviews: false
    require_code_owner_reviews: false

  # CI should pass but not strictly required
  required_status_checks:
    strict: false
    contexts: []

  required_conversation_resolution: false
  required_signatures: false
  enforce_admins: false
  restrictions: null

  # Allow more flexibility
  allow_force_pushes: true # For rebasing
  allow_deletions: false
  require_linear_history: false

  lock_branch: false

# =====================================================
# RULESETS (GitHub Rulesets - Alternative)
# =====================================================
# If using GitHub Rulesets instead of branch protection:

rulesets:
  - name: "Production Protection"
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["refs/heads/main"]
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 2
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_last_push_approval: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: "Backend CI Status"
            - context: "Frontend CI Status"
            - context: "Security Status"
      - type: non_fast_forward
      - type: required_signatures

  - name: "Development Protection"
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["refs/heads/dev"]
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 1
      - type: required_status_checks
        parameters:
          required_status_checks:
            - context: "Backend CI Status"
            - context: "Frontend CI Status"

# =====================================================
# SETUP INSTRUCTIONS
# =====================================================
#
# 1. Go to Repository Settings > Branches
# 2. Click "Add branch protection rule"
# 3. Enter branch name pattern (main, dev, django-rebuild)
# 4. Configure settings as documented above
# 5. Save changes
#
# For Rulesets:
# 1. Go to Repository Settings > Rules > Rulesets
# 2. Click "New ruleset"
# 3. Configure as documented above
#
# =====================================================
