# ============================================================
# NeuroLens CD — Staging Deployment
# ============================================================
# Trigger: Push to dev
# Behavior: Full CI validation, production-grade artifacts, deploy to staging
# ============================================================

name: CD Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  ENVIRONMENT: staging
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # WAIT FOR CI
  # ============================================================
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI Workflow
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: CI Status
          ref: ${{ github.sha }}
          timeoutSeconds: 900

  # ============================================================
  # BUILD PRODUCTION-GRADE ARTIFACTS
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.${COMMIT_COUNT}.0-staging"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=staging
            VERSION=${{ steps.version.outputs.version }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            ENVIRONMENT=staging

  # ============================================================
  # DEPLOY TO STAGING
  # ============================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment:
      name: staging
      url: https://staging.neurolens.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        if: ${{ secrets.KUBE_CONFIG_STAGING != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Deploy
        run: |
          echo "🚀 Deploying to Staging Environment"
          echo "Version: ${{ needs.build-backend.outputs.version }}"
          echo "Backend Image: ${{ needs.build-backend.outputs.image-tag }}"
          echo "Frontend Image: ${{ needs.build-frontend.outputs.image-tag }}"

          if [ -n "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
            
            # Blue-Green deployment
            kubectl set image deployment/neurolens-backend backend=${{ needs.build-backend.outputs.image-tag }} -n staging
            kubectl set image deployment/neurolens-frontend frontend=${{ needs.build-frontend.outputs.image-tag }} -n staging
            
            # Wait for rollout
            kubectl rollout status deployment/neurolens-backend -n staging --timeout=300s
            kubectl rollout status deployment/neurolens-frontend -n staging --timeout=300s
          fi

          echo "✅ Staging deployment complete"

  # ============================================================
  # SMOKE TESTS
  # ============================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Run Smoke Tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"

          if [ -n "$STAGING_URL" ]; then
            echo "Testing health endpoint..."
            curl -f "$STAGING_URL/api/health/" || exit 1
            echo "✅ Smoke tests passed"
          else
            echo "⚠️ STAGING_URL not configured, skipping"
          fi
