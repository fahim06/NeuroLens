# ============================================================
# NeuroLens CD — Staging Deployment
# ============================================================
# Triggers on dev branch
# Deploys to staging environment for QA testing
# Blue-Green deployment strategy
# Requires all CI checks to pass
# ============================================================

name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ENVIRONMENT: staging
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # WAIT FOR CI (REQUIRED)
  # ============================================================
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Backend CI
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Backend CI Status
          ref: ${{ github.sha }}
          timeoutSeconds: 900

      - name: Wait for Frontend CI
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Frontend CI Status
          ref: ${{ github.sha }}
          timeoutSeconds: 900

      - name: Wait for Security Scan
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Security Status
          ref: ${{ github.sha }}
          timeoutSeconds: 900
        continue-on-error: true

  # ============================================================
  # BUILD DOCKER IMAGES
  # ============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version
        id: version
        run: |
          # Generate semantic version based on commit count and date
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="0.${COMMIT_COUNT}.0-staging.${DATE}.${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            VERSION=${{ steps.version.outputs.version }}

  # ============================================================
  # RUN MIGRATIONS (DRY-RUN)
  # ============================================================
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install django djangorestframework

      - name: Check Pending Migrations
        run: |
          python manage.py showmigrations --plan | grep -E "^\[ \]" && {
            echo "⚠️ Pending migrations detected"
            echo "Migrations will be applied during deployment"
          } || echo "✅ No pending migrations"
        env:
          SECRET_KEY: "ci-migration-check"
          DEBUG: "False"
        continue-on-error: true

  # ============================================================
  # DEPLOY TO STAGING
  # ============================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, migration-check]
    environment:
      name: staging
      url: https://staging.neurolens.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Blue-Green Deployment
        run: |
          # Get current deployment (blue or green)
          CURRENT=$(kubectl get svc neurolens-active -n staging -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "blue")

          if [ "$CURRENT" == "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi

          echo "Current: $CURRENT -> Target: $TARGET"
          echo "TARGET_SLOT=$TARGET" >> $GITHUB_ENV

          # Deploy to target slot
          kubectl set image deployment/neurolens-backend-$TARGET \
            backend=${{ needs.build-images.outputs.backend-tag }} \
            -n staging --record || echo "Creating new deployment"
            
          kubectl set image deployment/neurolens-frontend-$TARGET \
            frontend=${{ needs.build-images.outputs.frontend-tag }} \
            -n staging --record || echo "Creating new deployment"

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/neurolens-backend-${{ env.TARGET_SLOT }} -n staging --timeout=300s
          kubectl rollout status deployment/neurolens-frontend-${{ env.TARGET_SLOT }} -n staging --timeout=300s

      - name: Run Migrations
        run: |
          # Get a backend pod
          POD=$(kubectl get pods -l app=neurolens-backend,slot=${{ env.TARGET_SLOT }} -n staging -o jsonpath='{.items[0].metadata.name}')

          if [ -n "$POD" ]; then
            kubectl exec $POD -n staging -- python manage.py migrate --no-input || echo "Migration step skipped"
          fi

      - name: Health Check
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=neurolens-backend,slot=${{ env.TARGET_SLOT }} -n staging --timeout=120s

          # Hit health endpoint on target slot
          TARGET_URL=$(kubectl get svc neurolens-${{ env.TARGET_SLOT }} -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "")
          if [ -n "$TARGET_URL" ]; then
            curl -f "http://$TARGET_URL/api/health/" || echo "Health check on target slot"
          fi

      - name: Switch Traffic
        run: |
          # Update service selector to point to new slot
          kubectl patch svc neurolens-active -n staging -p "{\"spec\":{\"selector\":{\"slot\":\"${{ env.TARGET_SLOT }}\"}}}"
          echo "✅ Traffic switched to ${{ env.TARGET_SLOT }}"

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "🔗 URL: https://staging.neurolens.example.com"
          echo "📦 Version: ${{ needs.build-images.outputs.version }}"
          echo "🎯 Active Slot: ${{ env.TARGET_SLOT }}"

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "🔄 Keeping previous deployment active"
          # The service selector wasn't changed yet if we fail before switch

  # ============================================================
  # SMOKE TESTS
  # ============================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Run Smoke Tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"

          if [ -z "$STAGING_URL" ]; then
            echo "⚠️ STAGING_URL not configured, skipping smoke tests"
            exit 0
          fi

          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f "$STAGING_URL/api/health/" || exit 1

          # Test frontend
          echo "Testing frontend..."
          curl -f "$STAGING_URL/" | grep -q "NeuroLens" || echo "Frontend check"

          # Test API docs
          echo "Testing API docs..."
          curl -f "$STAGING_URL/api/docs/" || echo "API docs check"

          echo "✅ Smoke tests passed"
        continue-on-error: true
