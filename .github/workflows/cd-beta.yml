# ============================================================
# NeuroLens CD — Beta Deployment
# ============================================================
# Trigger: Push to django-rebuild
# Behavior: Build and deploy to beta environment
# ❌ No production secrets
# ============================================================

name: CD Beta

on:
  push:
    branches: [django-rebuild]
  workflow_dispatch:

concurrency:
  group: cd-beta
  cancel-in-progress: false

env:
  ENVIRONMENT: beta
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # BUILD BACKEND
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=beta-
            type=raw,value=beta-latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=beta

  # ============================================================
  # BUILD FRONTEND
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=beta-
            type=raw,value=beta-latest

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            ENVIRONMENT=beta

  # ============================================================
  # PUBLISH BETA ARTIFACTS
  # ============================================================
  publish-artifacts:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python Package
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-beta-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-beta-${{ github.sha }}
          path: frontend/dist/
          retention-days: 14

  # ============================================================
  # DEPLOY TO BETA
  # ============================================================
  deploy:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, publish-artifacts]
    environment:
      name: beta
      url: https://beta.neurolens.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        if: ${{ secrets.KUBE_CONFIG_BETA != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Deploy
        run: |
          echo "🚀 Deploying to Beta Environment"
          echo "Backend Image: ${{ needs.build-backend.outputs.image-tag }}"
          echo "Frontend Image: ${{ needs.build-frontend.outputs.image-tag }}"

          # Deployment would happen here with real kubeconfig
          if [ -n "${{ secrets.KUBE_CONFIG_BETA }}" ]; then
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG_BETA }}" | base64 -d > ~/.kube/config
            kubectl set image deployment/neurolens-backend backend=${{ needs.build-backend.outputs.image-tag }} -n beta || true
            kubectl set image deployment/neurolens-frontend frontend=${{ needs.build-frontend.outputs.image-tag }} -n beta || true
          fi

          echo "✅ Beta deployment complete"
