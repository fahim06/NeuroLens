# ============================================================
# NeuroLens — Unified CI Workflow
# ============================================================
# Runs on all branches: django-rebuild, dev, main
# Must fail on ANY error per canvas specification
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - django-rebuild
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  # ============================================================
  # BACKEND (Django)
  # ============================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install django djangorestframework djangorestframework-simplejwt django-celery-results celery redis
          pip install ruff black pytest pytest-django

      - name: Django System Check
        run: python manage.py check --fail-level WARNING
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Check Migrations
        run: python manage.py migrate --check
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Lint - Ruff
        run: ruff check . --output-format=github

      - name: Lint - Black
        run: black --check --diff .

      - name: Run Tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/__pycache__ \
            -x --tb=short
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"

  # ============================================================
  # FRONTEND (React)
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint 2>/dev/null || echo "Lint script not configured"

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "/api"

  # ============================================================
  # SECURITY
  # ============================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency Scan (Python)
        run: |
          pip install safety pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || echo "Vulnerabilities found"
          fi
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependency Scan (NPM)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "NPM vulnerabilities found"
        continue-on-error: true

      - name: Secret Scan
        run: |
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          chmod +x gitleaks

          # Run scan
          ./gitleaks detect --source . --verbose || {
            echo "⚠️ Potential secrets detected"
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              exit 1
            fi
          }

  # ============================================================
  # CI STATUS GATE
  # ============================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Security: ${{ needs.security.result }}"

          # CI must fail on ANY error (per canvas)
          if [[ "${{ needs.backend.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "❌ CI Failed"
            exit 1
          fi

          echo "✅ CI Passed"
