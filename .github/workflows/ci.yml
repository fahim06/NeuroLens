name: NeuroLens CI

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "ml/**"
      - "frontend/**"
      - "tests/**"
      - "envs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [dev]

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # CHANGE DETECTION
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ml: ${{ steps.filter.outputs.ml }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'envs/neurolens-api.yml'
            ml:
              - 'ml/**'
              - 'envs/neurolens-ml.yml'
            frontend:
              - 'frontend/**'
            tests:
              - 'tests/**'
              - 'backend/**'
              - 'ml/**'

  # ============================================================
  # BACKEND CHECKS
  # ============================================================
  backend:
    name: Backend Checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Conda
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-api-${{ runner.os }}-${{ hashFiles('envs/neurolens-api.yml') }}
          restore-keys: |
            conda-api-${{ runner.os }}-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-api.yml
          activate-environment: neurolens-api
          use-only-tar-bz2: true

      - name: Validate Backend Syntax
        shell: bash -el {0}
        run: python -m compileall backend

      - name: Check Imports
        shell: bash -el {0}
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from backend.app import main"

  # ============================================================
  # ML CHECKS
  # ============================================================
  ml:
    name: ML Checks
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Conda
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-ml-${{ runner.os }}-${{ hashFiles('envs/neurolens-ml.yml') }}
          restore-keys: |
            conda-ml-${{ runner.os }}-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-ml.yml
          activate-environment: neurolens-ml
          use-only-tar-bz2: true

      - name: Validate ML Syntax
        shell: bash -el {0}
        run: python -m compileall ml

      - name: Check Imports
        shell: bash -el {0}
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from ml.core import base"

  # ============================================================
  # FRONTEND CHECKS (when frontend is tracked)
  # ============================================================
  frontend:
    name: Frontend Checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Frontend Exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20

      - name: Cache Node Modules
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Install & Build
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci
          npm run build

  # ============================================================
  # TESTS (syntax + import validation for dev)
  # ============================================================
  tests:
    name: Run Tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Conda
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-api-${{ runner.os }}-${{ hashFiles('envs/neurolens-api.yml') }}
          restore-keys: |
            conda-api-${{ runner.os }}-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-api.yml
          activate-environment: neurolens-api
          use-only-tar-bz2: true

      - name: Install Test Dependencies
        shell: bash -el {0}
        run: pip install pytest pytest-asyncio httpx

      - name: Run Tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v --ignore=tests/__pycache__ -x --tb=short

  # ============================================================
  # CI STATUS (required check for branch protection)
  # ============================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, backend, ml, frontend, tests]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "Backend: ${{ needs.backend.result }}"
          echo "ML: ${{ needs.ml.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Tests: ${{ needs.tests.result }}"

          # Fail if any required job failed (skipped is OK)
          if [[ "${{ needs.backend.result }}" == "failure" ]] || \
             [[ "${{ needs.ml.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.tests.result }}" == "failure" ]]; then
            echo "❌ CI Failed"
            exit 1
          fi

          echo "✅ CI Passed"
