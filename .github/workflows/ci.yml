name: NeuroLens CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-api.yml
          activate-environment: neurolens-api
      - name: Validate Backend
        shell: bash -el {0}
        run: python -m compileall backend

  ml:
    name: ML Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-ml.yml
          activate-environment: neurolens-ml
      - name: Validate ML
        shell: bash -el {0}
        run: python -m compileall ml

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: envs/neurolens-dev.yml
          activate-environment: neurolens-dev
      - name: Run Tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v --ignore=tests/__pycache__
