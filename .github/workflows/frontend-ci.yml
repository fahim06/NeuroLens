# ============================================================
# NeuroLens CI — Frontend (React)
# ============================================================
# Executes on ALL branches per CI/CD policy
# - django-rebuild: Full CI (beta validation)
# - dev: Full CI (required for staging)
# - main: Full CI + release gates
# ============================================================

name: Frontend CI

on:
  push:
    branches: [django-rebuild, dev, main]
    paths:
      - "frontend/**"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [django-rebuild, dev, main]
    paths:
      - "frontend/**"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.*"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # SETUP & INSTALL
  # ============================================================
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

  # ============================================================
  # LINT & FORMAT CHECK
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint 2>/dev/null || echo "Lint script not found, skipping..."
        continue-on-error: ${{ github.ref == 'refs/heads/django-rebuild' }}

      - name: Check Prettier Formatting
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx,css}" 2>/dev/null || echo "Prettier check skipped"
        continue-on-error: true

  # ============================================================
  # TYPE CHECK
  # ============================================================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: frontend
        run: npx tsc --noEmit

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "/api"

      - name: Build Stats
        working-directory: frontend
        run: |
          echo "📦 Build Output Stats:"
          du -sh dist/
          find dist -type f -name "*.js" -o -name "*.css" | head -20

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  # ============================================================
  # BUNDLE ANALYSIS (Optional)
  # ============================================================
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies (if cache miss)
        working-directory: frontend
        run: npm ci

      - name: Analyze Bundle
        working-directory: frontend
        run: |
          # Build with stats if available
          npm run build -- --report 2>/dev/null || npm run build

          echo "Bundle Analysis Complete"

  # ============================================================
  # CI STATUS GATE
  # ============================================================
  frontend-ci-status:
    name: Frontend CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Build: ${{ needs.build.result }}"

          # Strict failure check for dev and main
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
               [[ "${{ needs.build.result }}" == "failure" ]]; then
              echo "❌ Frontend CI Failed (strict mode)"
              exit 1
            fi
          else
            # django-rebuild: only fail on build errors
            if [[ "${{ needs.build.result }}" == "failure" ]]; then
              echo "❌ Frontend CI Failed (build error)"
              exit 1
            fi
          fi

          echo "✅ Frontend CI Passed"
