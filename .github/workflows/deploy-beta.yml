# ============================================================
# NeuroLens CD — Beta Deployment
# ============================================================
# Triggers on django-rebuild branch
# Deploys to beta environment for internal testing
# Blue-Green deployment strategy
# ============================================================

name: Deploy Beta

on:
  push:
    branches: [django-rebuild]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency only)"
        type: boolean
        default: false

concurrency:
  group: deploy-beta
  cancel-in-progress: false

env:
  ENVIRONMENT: beta
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # WAIT FOR CI
  # ============================================================
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Wait for Backend CI
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Backend CI Status
          ref: ${{ github.sha }}
          timeoutSeconds: 600
        continue-on-error: true

      - name: Wait for Frontend CI
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: Frontend CI Status
          ref: ${{ github.sha }}
          timeoutSeconds: 600
        continue-on-error: true

  # ============================================================
  # BUILD DOCKER IMAGES
  # ============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: wait-for-ci
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=beta-
            type=raw,value=beta-latest

      - name: Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=beta-
            type=raw,value=beta-latest

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=${{ env.ENVIRONMENT }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            ENVIRONMENT=${{ env.ENVIRONMENT }}

  # ============================================================
  # DEPLOY TO BETA
  # ============================================================
  deploy:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    needs: build-images
    environment:
      name: beta
      url: https://beta.neurolens.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BETA }}" | base64 -d > ~/.kube/config

      - name: Deploy Blue-Green (Blue)
        run: |
          # Update deployment with new image
          kubectl set image deployment/neurolens-backend \
            backend=${{ needs.build-images.outputs.backend-tag }} \
            -n beta --record || echo "Backend deployment not found, will create"
            
          kubectl set image deployment/neurolens-frontend \
            frontend=${{ needs.build-images.outputs.frontend-tag }} \
            -n beta --record || echo "Frontend deployment not found, will create"

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/neurolens-backend -n beta --timeout=300s || true
          kubectl rollout status deployment/neurolens-frontend -n beta --timeout=300s || true

      - name: Health Check
        run: |
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=neurolens-backend -n beta --timeout=120s || true

          # Hit health endpoint
          BETA_URL="${{ secrets.BETA_URL }}"
          if [ -n "$BETA_URL" ]; then
            curl -f "$BETA_URL/api/health/" || echo "Health check failed, but continuing..."
          fi

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Beta deployment successful!"
          echo "🔗 URL: https://beta.neurolens.example.com"
          echo "📦 Backend: ${{ needs.build-images.outputs.backend-tag }}"
          echo "📦 Frontend: ${{ needs.build-images.outputs.frontend-tag }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Beta deployment failed!"
          echo "🔄 Rolling back..."
          kubectl rollout undo deployment/neurolens-backend -n beta || true
          kubectl rollout undo deployment/neurolens-frontend -n beta || true
