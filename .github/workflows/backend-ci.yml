# ============================================================
# NeuroLens CI — Backend (Django)
# ============================================================
# Executes on ALL branches per CI/CD policy
# - django-rebuild: Full CI (beta validation)
# - dev: Full CI (required for staging)
# - main: Full CI + release gates
# ============================================================

name: Backend CI

on:
  push:
    branches: [django-rebuild, dev, main]
    paths:
      - "core/**"
      - "users/**"
      - "datasets/**"
      - "inference/**"
      - "neurolens/**"
      - "ml/**"
      - "tests/**"
      - "manage.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "envs/neurolens-django.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [django-rebuild, dev, main]
    paths:
      - "core/**"
      - "users/**"
      - "datasets/**"
      - "inference/**"
      - "neurolens/**"
      - "ml/**"
      - "tests/**"
      - "manage.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "envs/neurolens-django.yml"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: "neurolens.settings"

jobs:
  # ============================================================
  # SETUP & VALIDATION
  # ============================================================
  setup:
    name: Setup & Validate
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup.outputs.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Python Version
        id: setup
        run: echo "python-version=${{ env.PYTHON_VERSION }}" >> $GITHUB_OUTPUT

  # ============================================================
  # LINT & FORMAT CHECK
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-

      - name: Install Linters
        run: |
          pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff
        run: ruff check . --output-format=github
        continue-on-error: ${{ github.ref == 'refs/heads/django-rebuild' }}

      - name: Check Black Formatting
        run: black --check --diff .
        continue-on-error: ${{ github.ref == 'refs/heads/django-rebuild' }}

      - name: Check Import Sorting
        run: isort --check-only --diff .
        continue-on-error: ${{ github.ref == 'refs/heads/django-rebuild' }}

  # ============================================================
  # DJANGO SYSTEM CHECKS
  # ============================================================
  django-checks:
    name: Django System Checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-django-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-django-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt 2>/dev/null || pip install django djangorestframework djangorestframework-simplejwt

      - name: Django Check
        run: python manage.py check --fail-level WARNING
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "False"

      - name: Check Migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "False"

      - name: Validate Models
        run: python manage.py validate_templates 2>/dev/null || echo "Template validation skipped"
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "False"

  # ============================================================
  # UNIT TESTS
  # ============================================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-test-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt 2>/dev/null || pip install django djangorestframework djangorestframework-simplejwt pytest pytest-django pytest-asyncio httpx

      - name: Run Tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/__pycache__ \
            -x --tb=short \
            --junit-xml=test-results.xml
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ============================================================
  # BUILD VERIFICATION
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, django-checks, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip build wheel

      - name: Build Package
        run: python -m build --sdist --wheel --outdir dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        with:
          name: backend-dist
          path: dist/
          retention-days: 30

  # ============================================================
  # CI STATUS GATE
  # ============================================================
  backend-ci-status:
    name: Backend CI Status
    runs-on: ubuntu-latest
    needs: [lint, django-checks, tests, build]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Django Checks: ${{ needs.django-checks.result }}"
          echo "Tests: ${{ needs.tests.result }}"
          echo "Build: ${{ needs.build.result }}"

          # Strict failure check for dev and main
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "${{ needs.lint.result }}" == "failure" ]] || \
               [[ "${{ needs.django-checks.result }}" == "failure" ]] || \
               [[ "${{ needs.tests.result }}" == "failure" ]] || \
               [[ "${{ needs.build.result }}" == "failure" ]]; then
              echo "❌ Backend CI Failed (strict mode)"
              exit 1
            fi
          else
            # django-rebuild: only fail on critical issues
            if [[ "${{ needs.django-checks.result }}" == "failure" ]] || \
               [[ "${{ needs.tests.result }}" == "failure" ]]; then
              echo "❌ Backend CI Failed (core checks)"
              exit 1
            fi
          fi

          echo "✅ Backend CI Passed"
