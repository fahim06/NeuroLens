name: CI/CD

on:
  push:
    branches: [ django-rebuild, dev, main ]
    tags: [ 'v*.*.*' ]
    paths:
      - '**'
      - '!README.md'  # Prevent recursive loop if the only change is README
  pull_request:
    branches: [ django-rebuild, dev, main ]

concurrency:
  group: neuroLens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # BUMP VERSION - Runs only on django-rebuild, dev, main
  # ============================================================
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/django-rebuild' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Increment Version in README
        run: |
          import re
          import sys

          readme_path = 'README.md'
          
          try:
              with open(readme_path, 'r') as f:
                  content = f.read()
          
              # Regex to match the badge: <img src="https://img.shields.io/badge/version-2.0.10--alpha-blue" />
              # Captures: 1=prefix, 2=major, 3=minor, 4=patch, 5=suffix
              pattern = r'(<img src="https://img.shields.io/badge/version-)(\d+)\.(\d+)\.(\d+)(--alpha-blue" />)'
          
              match = re.search(pattern, content)
              if not match:
                  print("Version badge not found in README.md")
                  sys.exit(1)
          
              prefix = match.group(1)
              major = int(match.group(2))
              minor = int(match.group(3))
              patch = int(match.group(4))
              suffix = match.group(5)
          
              # Increment patch version
              new_patch = patch + 1
              new_version_str = f"{prefix}{major}.{minor}.{new_patch}{suffix}"
          
              new_content = content.replace(match.group(0), new_version_str)
          
              with open(readme_path, 'w') as f:
                  f.write(new_content)
          
              print(f"Bumped version from {major}.{minor}.{patch} to {major}.{minor}.{new_patch}")
          
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
        shell: python

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if README.md was modified
          if git diff --quiet README.md; then
            echo "No changes to commit."
          else
            git add README.md
            git commit -m "chore: bump version in README [skip ci]"
            git push
          fi

  # ============================================================
  # VALIDATE (CI) - Runs on all branches and PRs
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [ bump-version ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found; aborting."
            exit 1
          fi
          pip install ruff black pytest pytest-django bandit safety

      - name: Django System Check
        run: python manage.py check --fail-level WARNING
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Check Migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Lint - Ruff
        run: ruff check . --output-format=github --ignore F401,E402,F541,F841

      - name: Lint - Black
        run: black --check --diff .

      - name: Security Analysis - Bandit
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Tests
        run: |
          python manage.py test -v 2
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"

  # ============================================================
  # SECURITY SCAN - Runs on all branches and PRs
  # ============================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [ bump-version ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency Scan (Python)
        run: |
          pip install safety pip-audit bandit
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --output json || echo "Safety vulnerabilities found"
            pip-audit -r requirements.txt --format json || echo "Pip-audit vulnerabilities found"
          fi
        continue-on-error: true

      - name: Secret Scan
        run: |
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          chmod +x gitleaks

          # Run scan
          ./gitleaks detect --source . --verbose || {
            echo "⚠️ Potential secrets detected"
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              exit 1
            fi
          }

  # ============================================================
  # BUILD - Runs only on django-rebuild, dev, main
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ validate, security, bump-version ]
    if: github.ref == 'refs/heads/django-rebuild' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      backend-image-tag: ${{ steps.backend-meta.outputs.tags }}
      frontend-image-tag: ${{ steps.frontend-meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Build
      - name: Backend Image Metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=${{ github.ref == 'refs/heads/django-rebuild' && 'beta' || github.ref == 'refs/heads/dev' && 'staging' || 'production' }}

      # Frontend Build
      - name: Frontend Image Metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY - Conditional based on branch/tag
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ build ]
    if: (github.ref == 'refs/heads/django-rebuild' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) && !cancelled()
    environment:
      name: ${{ github.ref == 'refs/heads/django-rebuild' && 'beta' || github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      url: ${{ github.ref == 'refs/heads/django-rebuild' && 'https://beta.neurolens.example.com' || github.ref == 'refs/heads/dev' && 'https://staging.neurolens.example.com' || 'https://neurolens.example.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to ${{ github.ref == 'refs/heads/django-rebuild' && 'Beta' || github.ref == 'refs/heads/dev' && 'Staging' || 'Production' }}
        run: |
          echo "🚀 Deploying to ${{ github.ref == 'refs/heads/django-rebuild' && 'beta' || github.ref == 'refs/heads/dev' && 'staging' || 'production' }} environment"
          echo "Backend image: ${{ needs.build.outputs.backend-image-tag }}"
          echo "Frontend image: ${{ needs.build.outputs.frontend-image-tag }}"

          # Add deployment logic here based on your infrastructure
          # This could be kubectl, helm, docker-compose, etc.

          echo "✅ Deployment completed"