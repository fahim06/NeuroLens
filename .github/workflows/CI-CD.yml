name: CI/CD

on:
  push:
    branches: [ django-rebuild, dev, main ]
    tags: [ 'v*.*.*' ]
    paths:
      - '**'
      - '!README.md'  # Prevent recursive loop if the only change is README
  pull_request:
    branches: [ django-rebuild, dev, main ]

concurrency:
  group: neuroLens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # BUMP VERSION - Runs only on django-rebuild, dev, main
  # ============================================================
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/django-rebuild' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Increment Version in README
        run: |
          import re
          import sys

          readme_path = 'README.md'
          
          try:
              with open(readme_path, 'r') as f:
                  content = f.read()
          
              pattern = r'(<img src="https://img.shields.io/badge/version-)(\d+)\.(\d+)\.(\d+)(--beta-orange" />)'
          
              match = re.search(pattern, content)
              if not match:
                  print("Version badge not found in README.md")
                  sys.exit(1)
          
              prefix = match.group(1)
              major = int(match.group(2))
              minor = int(match.group(3))
              patch = int(match.group(4))
              suffix = match.group(5)
          
              # Increment patch version
              new_patch = patch + 1
              new_version_str = f"{prefix}{major}.{minor}.{new_patch}{suffix}"
          
              new_content = content.replace(match.group(0), new_version_str)
          
              with open(readme_path, 'w') as f:
                  f.write(new_content)
          
              print(f"Bumped version from {major}.{minor}.{patch} to {major}.{minor}.{new_patch}")
          
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
        shell: python

      - name: Update Version in URLs
        run: |
          import re
          import sys

          urls_path = 'neurolens/urls.py'
          
          try:
              with open(urls_path, 'r') as f:
                  content = f.read()
          
              # Get the new version from README
              readme_path = 'README.md'
              with open(readme_path, 'r') as f:
                  readme_content = f.read()
          
              # Extract version from README badge
              version_pattern = r'<img src="https://img.shields.io/badge/version-(\d+\.\d+\.\d+--beta)-orange" />'
              version_match = re.search(version_pattern, readme_content)
          
              if not version_match:
                  print("Version not found in README.md")
                  sys.exit(1)
          
              new_version = version_match.group(1)
          
              # Update version in urls.py
              urls_pattern = r'("version": ")[^"]*(")'
              new_content = re.sub(urls_pattern, f'\\g<1>{new_version}\\g<2>', content)
          
              with open(urls_path, 'w') as f:
                  f.write(new_content)
          
              print(f"Updated version in urls.py to {new_version}")
          
          except Exception as e:
              print(f"Error updating urls.py: {e}")
              sys.exit(1)
        shell: python

      - name: Update Model Version in Predictor
        run: |
          import re
          import sys

          predictor_path = 'ml/runtime/predictor.py'
          
          try:
              with open(predictor_path, 'r') as f:
                  content = f.read()
          
              # Get the new version from README
              readme_path = 'README.md'
              with open(readme_path, 'r') as f:
                  readme_content = f.read()
          
              # Extract version from README badge
              version_pattern = r'<img src="https://img.shields.io/badge/version-(\d+\.\d+\.\d+--beta)-orange" />'
              version_match = re.search(version_pattern, readme_content)
          
              if not version_match:
                  print("Version not found in README.md")
                  sys.exit(1)
          
              base_version = version_match.group(1).replace('--beta', '')
          
              # Update model_version in predictor.py (real predictions)
              content = re.sub(
                  r'("model_version": ")[^"]*(")',
                  f'\\g<1>{base_version}\\g<2>',
                  content
              )
          
              # Update model_version in predictor.py (mock predictions)
              content = re.sub(
                  r'("model_version": ")[^"]*-mock(")',
                  f'\\g<1>{base_version}-mock\\g<2>',
                  content
              )
          
              with open(predictor_path, 'w') as f:
                  f.write(content)
          
              print(f"Updated model versions in predictor.py to {base_version}")
          
          except Exception as e:
              print(f"Error updating predictor.py: {e}")
              sys.exit(1)
        shell: python

      - name: Commit and Push All Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if any files were modified
          if git diff --quiet README.md neurolens/urls.py ml/runtime/predictor.py; then
            echo "No changes to commit."
          else
            git add README.md neurolens/urls.py ml/runtime/predictor.py
            git commit -m "chore: bump version across all files [skip ci]"
            git push
          fi

  # ============================================================
  # VALIDATE (CI) - Runs on all branches and PRs
  # ============================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [ bump-version ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found; aborting."
            exit 1
          fi
          pip install ruff==0.6.9 black==25.1.0 pytest pytest-django bandit safety

      - name: Django System Check
        run: python manage.py check --fail-level WARNING
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Check Migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"

      - name: Lint - Ruff
        run: ruff check . --output-format=github --ignore F401,E402,F541,F841

      - name: Lint - Black
        run: black --check --diff .

      - name: Security Analysis - Bandit
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Tests
        run: |
          python manage.py test -v 2
        env:
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          REDIS_URL: "redis://localhost:6379/0"

  # ============================================================
  # SECURITY SCAN - Runs on all branches and PRs
  # ============================================================
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [ bump-version ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency Scan (Python)
        run: |
          pip install safety pip-audit bandit
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --output json || echo "Safety vulnerabilities found"
            pip-audit -r requirements.txt --format json || echo "Pip-audit vulnerabilities found"
          fi
        continue-on-error: true

      - name: Secret Scan
        run: |
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          chmod +x gitleaks

          # Run scan
          ./gitleaks detect --source . --verbose || {
            echo "⚠️ Potential secrets detected"
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              exit 1
            fi
          }